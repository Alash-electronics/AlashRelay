sentence=Easy relay module library: no click at power-up, active-low support, timed pulses, switching protection and interlock for motor reversing. No dependencies.
paragraph=Controls relay modules safely: begin() sets the off level before enabling the pin so the relay does not click at start, supports active-LOW modules, runs timed pulses and delays without delay(), limits too frequent switching, switches off after a maximum on-time, interlocks two relays for motor reversing with a dead time and counts switches. Explains problems in Russian, Kazakh or English. Works on Arduino AVR, ESP32, ESP8266. Examples included, made for classes and kits by Alash Electronics.
